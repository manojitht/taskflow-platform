apiVersion: v1
kind: Namespace
metadata: { name: taskflow }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: taskflow, namespace: taskflow }
spec:
  replicas: 2
  selector: { matchLabels: { app: taskflow } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: taskflow } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: web
          image: IMAGE_PLACEHOLDER   # replaced by CI with the ECR image:tag
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: taskflow-secrets } }]  # DATABASE_URL, SECRET_KEY
          env: [{ name: COOKIE_SECURE, value: "true" }]
          readinessProbe: { httpGet: { path: /readyz, port: 8000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata: { name: taskflow, namespace: taskflow }
spec:
  selector: { app: taskflow }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: taskflow, namespace: taskflow }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: taskflow }
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
# Requires the AWS Load Balancer Controller (README step 7)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow
  namespace: taskflow
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: taskflow, port: { number: 80 } } } }
